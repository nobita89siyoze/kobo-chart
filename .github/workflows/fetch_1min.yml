name: Fetch 1min OHLCV

on:
  workflow_dispatch:
    inputs:
      targets:
        description: '銘柄コードと日付 (例: 6278,2026-04-22;6855,2026-03-17)'
        required: true
        default: '6278,2026-04-22;6855,2026-03-17;5262,2026-03-13;9887,2026-03-04'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Fetch 1min data
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python fetch_1min.py "${{ github.event.inputs.targets }}"

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: 1min-ohlcv
          path: output/*.csv
          retention-days: 7
