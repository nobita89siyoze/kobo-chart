<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公募銘柄 1分足チャート</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');
  :root {
    --bg: #0a0c10; --surface: #111318; --surface2: #181c24;
    --border: #222730; --accent: #00d4aa; --up: #00d4aa; --down: #ff4560;
    --text: #e8eaf0; --muted: #5a6070;
    --mono: 'JetBrains Mono', monospace; --sans: 'Noto Sans JP', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); height:100vh; display:flex; flex-direction:column; overflow:hidden; font-size:12px; }

  .token-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:8px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  label { font-size:10px; color:var(--muted); font-family:var(--mono); white-space:nowrap; }
  input { background:var(--bg); border:1px solid var(--border); border-radius:5px; color:var(--text); font-family:var(--mono); font-size:11px; padding:5px 8px; outline:none; transition:border-color 0.2s; }
  input:focus { border-color:var(--accent); }
  #apiKeyInput { width:300px; }
  #codeInput { width:80px; }
  #dateInput { width:130px; color-scheme:dark; }
  .btn { background:var(--accent); color:#000; border:none; border-radius:5px; padding:6px 14px; font-family:var(--mono); font-size:11px; font-weight:700; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
  .btn:hover { background:#00f0c0; }
  .btn:disabled { background:var(--muted); cursor:not-allowed; }
  .btn-sub { background:transparent; color:var(--muted); border:1px solid var(--border); }
  .btn-sub:hover { border-color:var(--accent); color:var(--accent); background:transparent; }
  .tok-status { font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:3px; }
  .tok-ok { background:rgba(0,212,170,0.15); color:var(--accent); }
  .tok-ng { background:rgba(255,69,96,0.15); color:var(--down); }

  .ctrl-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:7px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .chip { display:flex; align-items:center; gap:5px; background:var(--surface2); border:1px solid var(--border); border-radius:14px; padding:3px 8px 3px 10px; font-family:var(--mono); font-size:11px; cursor:pointer; transition:all 0.15s; }
  .chip:hover, .chip.active { border-color:var(--accent); color:var(--accent); }
  .chip .rm { color:var(--muted); font-size:13px; padding:0 1px; }
  .chip .rm:hover { color:var(--down); }

  .main { display:flex; flex:1; min-height:0; }
  .sidebar { width:190px; min-width:190px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .sb-title { font-family:var(--mono); font-size:9px; color:var(--muted); letter-spacing:2px; padding:8px 12px 6px; border-bottom:1px solid var(--border); }
  .stat-row { display:flex; justify-content:space-between; align-items:center; padding:6px 12px; border-bottom:1px solid rgba(34,39,48,0.4); }
  .sl { color:var(--muted); font-family:var(--mono); font-size:9px; }
  .sv { font-family:var(--mono); font-size:11px; font-weight:600; }
  .sv.up { color:var(--up); } .sv.down { color:var(--down); }
  .candle-list { flex:1; overflow-y:auto; font-family:var(--mono); font-size:9px; padding:4px; }
  .crow { display:grid; grid-template-columns:42px 1fr 1fr; gap:2px; padding:2px 4px; border-radius:2px; color:var(--muted); }
  .crow:hover { background:var(--surface2); color:var(--text); }
  .crow.up-r { border-left:2px solid var(--up); }
  .crow.dn-r { border-left:2px solid var(--down); }

  .chart-area { flex:1; display:flex; flex-direction:column; min-width:0; }
  .chart-hdr { background:var(--surface); border-bottom:1px solid var(--border); padding:7px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-height:38px; }
  #chartDiv { flex:1; min-height:0; }
  .empty { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--muted); }
  .empty .ico { font-size:36px; opacity:0.2; }
  .empty p { font-family:var(--mono); font-size:11px; line-height:2; text-align:center; }

  .status-bar { background:var(--surface); border-top:1px solid var(--border); padding:6px 14px; font-family:var(--mono); font-size:10px; color:var(--muted); display:flex; align-items:center; gap:6px; min-height:32px; }
  .sdot { width:6px; height:6px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .sdot.loading { background:var(--accent); animation:pulse 1s infinite; }
  .sdot.ok { background:var(--up); } .sdot.error { background:var(--down); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }
  ::-webkit-scrollbar{width:3px} ::-webkit-scrollbar-track{background:var(--bg)} ::-webkit-scrollbar-thumb{background:var(--border); border-radius:2px}
</style>
</head>
<body>

<!-- APIキー入力 (V2対応) -->
<div class="token-bar">
  <label>API KEY (V2)</label>
  <input type="password" id="apiKeyInput" placeholder="J-Quants APIキーを貼り付け（ダッシュボードで発行）">
  <button class="btn" onclick="setApiKey()">セット</button>
  <span class="tok-status tok-ng" id="tokSt">未設定</span>
  <span style="font-size:10px;color:var(--muted)">※ <a href="https://jpx-jquants.com/" target="_blank" style="color:var(--accent)">jpx-jquants.com</a> ダッシュボードで発行 ／ 分足はLightプラン＋アドオン必須</span>
</div>

<!-- 銘柄・日付入力 -->
<div class="ctrl-bar">
  <label>銘柄コード</label>
  <input type="text" id="codeInput" placeholder="例: 7203" maxlength="5">
  <label>受渡日</label>
  <input type="date" id="dateInput">
  <button class="btn" onclick="addStock()">＋ 追加・取得</button>
  <button class="btn btn-sub" onclick="clearAll()">クリア</button>
  <div class="chips" id="chips"><span style="font-size:10px;color:var(--muted);font-family:var(--mono)">銘柄を追加してください</span></div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sb-title">SUMMARY</div>
    <div id="statsPanel"><div style="padding:14px 12px;color:var(--muted);font-size:10px;font-family:var(--mono);line-height:2">銘柄を選択すると<br>統計が表示されます</div></div>
    <div class="sb-title">1MIN LIST</div>
    <div class="candle-list" id="candleList"></div>
  </div>
  <div class="chart-area">
    <div class="chart-hdr" id="chartHdr"><span style="font-family:var(--mono);font-size:11px;color:var(--muted)">① APIキーをセット → ② 銘柄コード・受渡日を入力して追加</span></div>
    <div id="chartDiv">
      <div class="empty">
        <div class="ico">📊</div>
        <p>J-Quants APIキー（V2）をセットして<br>銘柄コードと受渡日を入力してください<br><br>※分足取得にはLightプラン＋分足アドオンが必要です</p>
      </div>
    </div>
  </div>
</div>

<div class="status-bar"><div class="sdot" id="sdot"></div><span id="stTxt">準備完了</span></div>

<script>
let apiKey = null, stocks = [], currentKey = null, chart = null, cs = null;
document.getElementById('dateInput').value = new Date().toISOString().slice(0,10);

// ── APIキーセット（V2はそのまま使うだけ、認証不要）──
function setApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) { alert('APIキーを入力してください'); return; }
  apiKey = key;
  document.getElementById('tokSt').textContent = '✓ セット済み';
  document.getElementById('tokSt').className = 'tok-status tok-ok';
  setSt('ok', 'APIキーをセットしました — 銘柄コードと受渡日を入力して追加してください');
}

function addStock() {
  const code = document.getElementById('codeInput').value.trim();
  const date = document.getElementById('dateInput').value;
  if (!code) { alert('銘柄コードを入力してください'); return; }
  if (!date) { alert('受渡日を入力してください'); return; }
  if (!apiKey) { alert('先にAPIキーをセットしてください'); return; }
  const key = code+'_'+date;
  if (!stocks.find(s=>s.key===key)) stocks.push({code, date, key, label:`${code} (${date.slice(5)})`});
  document.getElementById('codeInput').value = '';
  renderChips();
  fetchStock(code, date, key);
}

function renderChips() {
  const el = document.getElementById('chips');
  if (!stocks.length) { el.innerHTML='<span style="font-size:10px;color:var(--muted);font-family:var(--mono)">銘柄を追加してください</span>'; return; }
  el.innerHTML = stocks.map(s=>`
    <div class="chip ${currentKey===s.key?'active':''}" onclick="switchStock('${s.key}')">
      ${s.label}
      <span class="rm" onclick="event.stopPropagation();removeStock('${s.key}')">×</span>
    </div>`).join('');
}

function removeStock(key) {
  stocks = stocks.filter(s=>s.key!==key);
  if (currentKey===key) { currentKey=null; clearChart(); }
  renderChips();
}

function clearAll() { stocks=[]; currentKey=null; renderChips(); clearChart(); }

function clearChart() {
  document.getElementById('chartDiv').innerHTML='<div class="empty"><div class="ico">📊</div><p>銘柄を選択してください</p></div>';
  document.getElementById('chartHdr').innerHTML='<span style="font-family:var(--mono);font-size:11px;color:var(--muted)">銘柄を選択してください</span>';
  document.getElementById('statsPanel').innerHTML='<div style="padding:14px 12px;color:var(--muted);font-size:10px;font-family:var(--mono);line-height:2">銘柄を選択すると<br>統計が表示されます</div>';
  document.getElementById('candleList').innerHTML='';
  chart=null; cs=null;
}

function switchStock(key) {
  const s = stocks.find(x=>x.key===key);
  if (!s) return;
  if (s.data) { currentKey=key; renderChips(); renderChart(s); }
  else fetchStock(s.code, s.date, s.key);
}

async function fetchStock(code, date, key) {
  setSt('loading', `${code} (${date}) データ取得中...`);
  try {
    // V2 API: x-api-key ヘッダーで認証
    // 分足エンドポイント: /v2/equities/bars/minute
    const dateFormatted = date.replace(/-/g, ''); // YYYYMMDD形式
    const url = `https://api.jquants.com/v2/equities/bars/minute?code=${code}&date=${dateFormatted}`;
    
    const r = await fetch(url, {
      headers: { 'x-api-key': apiKey }
    });

    if (!r.ok) {
      const e = await r.json().catch(()=>({}));
      throw new Error(`HTTP ${r.status}: ${JSON.stringify(e)}`);
    }

    const json = await r.json();
    // V2のレスポンス形式: { bars_minute: [...] }
    let rows = json.bars_minute || json.bars || json.data || [];

    if (!rows.length) {
      setSt('error', `${code}: データなし（分足アドオン未契約、または受渡日が取引日でない可能性）`);
      return;
    }

    // 9:00〜11:30フィルタ
    rows = rows.filter(r => {
      const t = (r.DateTime || r.datetime || r.time || '').slice(11,16);
      return t >= '09:00' && t <= '11:30';
    });

    if (!rows.length) {
      setSt('error', `${code}: 9:00〜11:30のデータなし`);
      return;
    }

    const candles = rows.map(r => {
      // V2はカラム名が短縮: DateTime, O, H, L, C, Vo など
      const dt = r.DateTime || r.datetime || '';
      return {
        time: Math.floor(new Date(dt.replace(' ','T')+'+09:00').getTime()/1000),
        open:  r.O || r.Open  || r.open  || 0,
        high:  r.H || r.High  || r.high  || 0,
        low:   r.L || r.Low   || r.low   || 0,
        close: r.C || r.Close || r.close || 0,
        volume: r.Vo || r.Volume || r.volume || 0,
        rawTime: dt.slice(11,16)
      };
    }).sort((a,b)=>a.time-b.time);

    const s = stocks.find(x=>x.key===key);
    if (s) s.data = candles;
    currentKey = key;
    renderChips();
    renderChart(s);
    setSt('ok', `${code} (${date})  ${candles.length}本取得完了`);

  } catch(e) {
    setSt('error', '取得失敗: ' + e.message);
  }
}

function renderChart(s) {
  const candles = s.data;
  const el = document.getElementById('chartDiv');
  el.innerHTML = '';
  chart = null; cs = null;

  chart = LightweightCharts.createChart(el, {
    layout: { background:{type:'solid',color:'#0a0c10'}, textColor:'#5a6070' },
    grid: { vertLines:{color:'#181c24'}, horzLines:{color:'#181c24'} },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor:'#222730' },
    timeScale: {
      borderColor:'#222730', timeVisible:true, secondsVisible:false,
      tickMarkFormatter: t => {
        const d = new Date(t*1000);
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      }
    },
    width: el.clientWidth, height: el.clientHeight||380,
  });

  cs = chart.addCandlestickSeries({
    upColor:'#00d4aa', downColor:'#ff4560',
    borderUpColor:'#00d4aa', borderDownColor:'#ff4560',
    wickUpColor:'#00d4aa', wickDownColor:'#ff4560',
  });
  cs.setData(candles);
  chart.timeScale().fitContent();
  chart.subscribeCrosshairMove(p => {
    if (!p.seriesData||!cs) return;
    const b = p.seriesData.get(cs);
    if (b) updateOHLC(b);
  });
  new ResizeObserver(()=>{ if(chart) chart.applyOptions({width:el.clientWidth,height:el.clientHeight||380}); }).observe(el);

  updateChartHdr(s, candles);
  updateStats(candles);
  updateCandleList(candles);
}

function updateChartHdr(s, c) {
  const last=c[c.length-1], first=c[0];
  const chg=last.close-first.open, pct=(chg/first.open*100).toFixed(2), up=chg>=0;
  document.getElementById('chartHdr').innerHTML=`
    <span style="font-family:var(--mono);font-size:17px;font-weight:700">${s.code}</span>
    <span style="font-family:var(--mono);font-size:14px;font-weight:600;color:${up?'var(--up)':'var(--down)'}">${last.close.toLocaleString()}</span>
    <span style="font-family:var(--mono);font-size:11px;color:${up?'var(--up)':'var(--down)'}">${up?'▲':'▼'}${Math.abs(chg).toFixed(0)} (${up?'+':''}${pct}%)</span>
    <span style="font-family:var(--mono);font-size:10px;color:var(--muted)">受渡日: ${s.date}</span>
    <span style="font-family:var(--mono);font-size:10px;color:var(--muted)" id="ohlc">
      O:<b style="color:var(--text)">${first.open.toLocaleString()}</b>
      H:<b style="color:var(--up)">${Math.max(...c.map(x=>x.high)).toLocaleString()}</b>
      L:<b style="color:var(--down)">${Math.min(...c.map(x=>x.low)).toLocaleString()}</b>
      C:<b style="color:var(--text)">${last.close.toLocaleString()}</b>
    </span>`;
}

function updateOHLC(b) {
  const el=document.getElementById('ohlc'); if(!el) return;
  el.innerHTML=`O:<b style="color:var(--text)">${b.open.toLocaleString()}</b> H:<b style="color:var(--up)">${b.high.toLocaleString()}</b> L:<b style="color:var(--down)">${b.low.toLocaleString()}</b> C:<b style="color:var(--text)">${b.close.toLocaleString()}</b> Vol:<b>${(b.volume||0).toLocaleString()}</b>`;
}

function updateStats(c) {
  const closes=c.map(x=>x.close), highs=c.map(x=>x.high), lows=c.map(x=>x.low);
  const f=c[0].open, l=closes[closes.length-1];
  const chg=l-f, pct=(chg/f*100).toFixed(2), up=chg>=0;
  const upCnt=c.filter(x=>x.close>=x.open).length;
  let peak=f, maxDD=0;
  closes.forEach(cl=>{ if(cl>peak)peak=cl; const dd=(peak-cl)/peak*100; if(dd>maxDD)maxDD=dd; });
  const totalVol=c.reduce((a,x)=>a+(x.volume||0),0);
  document.getElementById('statsPanel').innerHTML=[
    ['始値(9:00)', f.toLocaleString(), ''],
    ['終値(11:30)', l.toLocaleString(), up?'up':'down'],
    ['午前変動', (up?'+':'')+pct+'%', up?'up':'down'],
    ['高値', Math.max(...highs).toLocaleString(), 'up'],
    ['安値', Math.min(...lows).toLocaleString(), 'down'],
    ['値幅', (Math.max(...highs)-Math.min(...lows)).toLocaleString(), ''],
    ['上昇足 / 全本数', `${upCnt} / ${c.length}`, ''],
    ['上昇率', (upCnt/c.length*100).toFixed(0)+'%', upCnt/c.length>=0.5?'up':'down'],
    ['最大DD', '-'+maxDD.toFixed(2)+'%', 'down'],
    ['合計出来高', totalVol.toLocaleString(), ''],
  ].map(([l,v,cls])=>`<div class="stat-row"><span class="sl">${l}</span><span class="sv ${cls}">${v}</span></div>`).join('');
}

function updateCandleList(c) {
  document.getElementById('candleList').innerHTML = c.map(x=>{
    const up=x.close>=x.open, pct=((x.close-x.open)/x.open*100).toFixed(1);
    return `<div class="crow ${up?'up-r':'dn-r'}">
      <span>${x.rawTime}</span>
      <span style="color:${up?'var(--up)':'var(--down)'};font-weight:600">${x.close.toLocaleString()}</span>
      <span style="color:${up?'var(--up)':'var(--down)'}">${up?'+':''}${pct}%</span>
    </div>`;
  }).join('');
}

function setSt(type, msg) {
  document.getElementById('stTxt').textContent=msg;
  document.getElementById('sdot').className='sdot '+type;
}
</script>
</body>
</html>
